submission:
  title: "Netra — Predictive Crime Hotspot Intelligence"   # REQUIRED

  problem_statement: >                 # REQUIRED
    A district Station House Officer (SHO) has limited patrol units and must decide,
    every week, where to place them — today that leans on memory and last week's
    incident list, so crews are spread thin, repeat hotspots are missed, and there is
    no explainable, forward-looking view of where risk is concentrating or why.

  solution_summary: >                  # REQUIRED
    Netra bins station incidents into H3 hexagons and fits a Poisson/negative-binomial
    GLM on a leakage-free hex-week panel to predict each micro-zone's probability of an
    incident next week with per-driver explanations; a rolling-origin backtest proves it
    beats random and persistence baselines, a grounded LLM assistant answers questions
    strictly from each zone's on-screen data, and a weekly redeployment brief turns the
    ranking into a patrol plan the officer adjusts in plain language and approves.

  key_features:                        # REQUIRED
    - "Explainable weekly hotspot prediction (Poisson/NegBin GLM over an H3 hex-week panel) with ranked per-driver contributions"
    - "Rolling-origin backtest page proving accuracy: hit rate, PAI ~3.4x vs random patrol, PEI, and a persistence-baseline comparison"
    - "Grounded zone chat assistant (OpenAI-compatible LLM) hardened with server-built context, injection pre-filter, leak canary and rate limits"
    - "Weekly SHO patrol-redeployment brief, reshaped in plain language and Approve/Modify/Reject-recorded — nothing auto-dispatched"
    - "Interactive deck.gl H3 risk map with spike alerts, geo-correlated news/events and zone compare"

  tech_stack:
    languages: ["Python", "TypeScript"]          # REQUIRED
    frameworks: ["FastAPI", "Next.js 14", "React 19", "Vite", "statsmodels", "deck.gl", "MapLibre", "Tailwind CSS"]
    ibm_technologies: ["IBM Bob-compatible OpenAI-style inference interface (assistant runs on Groq gpt-oss in this build)"]
    databases: ["SQLite (SQLModel/SQLAlchemy)"]
    other: ["H3 hex grid", "pandas", "scikit-learn", "SciPy", "GDELT news API", "Resend email", "Docker Compose", "GitHub Actions"]

  what_we_are_most_proud_of: >
    The backtest. Drawing a heatmap and claiming it predicts crime is easy; proving it is
    not. Netra's accuracy page runs an honest rolling-origin evaluation — refit on the
    past, predict the next week blind, measure what was caught — and reports PAI/PEI
    against random and persistence baselines. Combined with per-driver explanations for
    every zone, the officer sees why, not just where.

  known_limitations: >
    Incident data is synthetic (seeded generator for the Gandhinagar/Infocity
    jurisdiction), not a live CCTNS feed — the modelling and metrics are real, the
    numbers are not. The assistant currently runs on Groq's OpenAI-compatible endpoint
    rather than a live IBM Bob inference endpoint (a config-level swap), and the free
    tier's daily token caps can make it temporarily unavailable. The single-origin join
    of the two apps is a dev-server proxy, the sign-in gate is a convenience rather than
    a security boundary, and the Drug Risk module is a placeholder.

